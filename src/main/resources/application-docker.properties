# Configuración de H2 para Docker
spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de la consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración JWT para Docker
app.jwt.secret=${JWT_SECRET:TGlicmFyeURvY2tlclNlY3JldEtleTIwMjZTZWN1cmVBbmRMb25nRW5vdWdo}
app.jwt.expiration-ms=86400000